<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Allan Leal — Sistema de Gestión Médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f0f2f0;min-height:100vh;font-size:15px;color:#1a1a1a}
:root{
  --green:#1a6b4a;--green-light:#e8f5ef;--green-mid:#2d9068;--green-dark:#0f4c2e;
  --blue:#185fa5;--blue-light:#eef4fb;
  --red:#c0392b;--red-light:#fee2e2;
  --warn:#d97706;--warn-light:#fef3c7;
  --border:rgba(0,0,0,0.11);--radius:12px;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --card:#ffffff;
}
/* ===== FONDO COMPLETO CON IMAGEN ===== */
#loginScreen{
  background:
    linear-gradient(rgba(11,94,215,0.75), rgba(10,25,48,0.85)),
    url('ALLAN2 (1).jpeg') center/cover no-repeat !important;
  position:relative;
}

/* QUITA IMAGEN PEQUEÑA ANTERIOR */
#loginScreen::after{
  display:none !important;
}

/* QUITA TEXTO GRANDE IZQUIERDA */
.loginLeft h1,
.loginLeft p{
  display:none !important;
}

/* ESTILO LIMPIO DEL PANEL */
.loginLeft{
  background:transparent !important;
}

/* QUITA USUARIOS DE ACCESO */
.usuariosAcceso,
#usuariosAcceso,
small,
.loginRight small{
  display:none !important;
}
/* 🔴 FORZAR SOLO UNA COLUMNA */
.loginWrap{
  display:block !important;
  max-width:380px !important;
  width:100% !important;
}

/* 🔵 ELIMINAR PANEL IZQUIERDO */
.loginLeft{
  display:none !important;
  width:0 !important;
  padding:0 !important;
  margin:0 !important;
}

/* 🟢 AJUSTAR LOGIN */
.loginRight{
  width:100% !important;
  border-radius:15px !important;
  box-shadow:0 30px 80px rgba(0,0,0,0.4);
}
/* 🔵 LOGIN FLOTANTE (EFECTO VIDRIO) */
.loginRight{
  background:rgba(255,255,255,0.12) !important;
  backdrop-filter:blur(14px);
  border-radius:18px;
  padding:2.5rem 2rem;
  box-shadow:0 25px 80px rgba(0,0,0,0.45);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
}

/* 🧊 INPUTS MÁS LIMPIOS */
.loginRight input{
  background:rgba(255,255,255,0.9);
  border:none;
}

/* 🔵 BOTÓN AZUL PRO */
.btnLogin{
  background:linear-gradient(135deg,#0b5ed7,#3d8bfd) !important;
  border:none;
  color:white;
  font-weight:500;
  transition:0.3s;
}

.btnLogin:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* ✨ CENTRADO MÁS FINO */
.loginWrap{
  display:flex !important;
  justify-content:center !important;
  align-items:center !important;
}
/* 🔵 NOMBRE EN AZUL */
.loginRight .logo h2{
  color:#0b5ed7 !important;
  font-weight:600;
  letter-spacing:0.3px;
}

/* TEXTO SECUNDARIO MÁS SUAVE */
.loginRight .logo p{
  color:rgba(255,255,255,0.85);
}
/* ✨ ANIMACIÓN DE ENTRADA */
.loginRight{
  animation:fadeZoom 0.7s ease;
}

/* KEYFRAMES */
@keyframes fadeZoom{
  0%{
    opacity:0;
    transform:scale(0.9) translateY(20px);
  }
  100%{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}
.loginWrap{
  animation:fadeZoom 0.7s ease;
}
/* ✨ ANIMACIÓN AL ENTRAR AL SISTEMA */
.fadeOut{
  animation:fadeOut 0.5s forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
    transform:scale(0.95);
  }
}

.fadeIn{
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
/* 🔄 SPINNER */
.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,0.3);
  border-top:2px solid white;
  border-radius:50%;
  display:inline-block;
  animation:spin 0.6s linear infinite;
  margin-right:8px;
  vertical-align:middle;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}
/* ── LOGIN ─────────────────────────────────────── */
#loginScreen{
  position:fixed;
  inset:0;
  background:url('ALLAN2 (1).jpeg') center/cover no-repeat !important;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.loginWrap{display:flex;gap:0;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.35);max-width:860px;width:95%}
.featureList{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.featureList li{font-size:13px;opacity:.85;display:flex;align-items:center;gap:.5rem}
.featureList li::before{content:'';width:6px;height:6px;border-radius:50%;background:#7dd4aa;flex-shrink:0}
.loginRight{background:white;padding:2.5rem 2rem;width:340px;display:flex;flex-direction:column;justify-content:center}
.loginRight .logo{text-align:center;margin-bottom:2rem}
.loginRight .logo svg{width:48px;height:48px}
.loginRight .logo h2{font-size:20px;font-weight:600;color:var(--green);margin-top:.5rem}
.loginRight .logo p{font-size:12px;color:#888;margin-top:2px}
.loginRight label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:5px;margin-top:1rem}
.loginRight input{width:100%;padding:10px 13px;border:1.5px solid #e0e0dd;border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:.2s;background:#fafaf8}
.loginRight input:focus{border-color:var(--green);background:white;box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.btnLogin{width:100%;padding:12px;background:var(--green);color:white;border:none;border-radius:9px;font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:1.5rem;transition:.2s;letter-spacing:.2px}
.btnLogin:hover{background:var(--green-dark);transform:translateY(-1px)}
.btnLogin:active{transform:translateY(0)}
.loginChips{display:flex;flex-wrap:wrap;gap:4px;margin-top:.75rem}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:#f0f5f2;color:#555}
.chip span{color:var(--green);font-weight:600}
.loginError{color:var(--red);font-size:13px;margin-top:.75rem;text-align:center;display:none;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── APP SHELL ──────────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{
  background:var(--blue);;color:white;
  padding:.7rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.topbar .brand{display:flex;align-items:center;gap:.65rem;font-size:15px;font-weight:500}
.topbar .brand svg{opacity:.9}
.topRight{display:flex;align-items:center;gap:.75rem}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;letter-spacing:.5px}
.topName{font-size:13px;opacity:.9}
.btnOut{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:white;padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s}
.btnOut:hover{background:rgba(255,255,255,.25)}

.layout{display:flex;flex:1;min-height:calc(100vh - 50px)}
.sidebar{
  width:210px;background:white;border-right:1px solid var(--border);
  padding:.75rem .6rem;flex-shrink:0;
  display:flex;flex-direction:column;gap:2px;
}
.navBtn{
  width:100%;display:flex;align-items:center;gap:.65rem;
  padding:.6rem .8rem;border:none;background:none;
  border-radius:9px;cursor:pointer;font-size:13.5px;
  color:#555;text-align:left;font-family:'DM Sans',sans-serif;
  transition:.15s;
}
.navBtn:hover{background:#f0f5f2;color:#1a1a1a}
.navBtn.active{background:var(--green-light);color:var(--green);font-weight:500}
.navIcon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.navLabel{flex:1}
.sidebar-footer{margin-top:auto;padding-top:.75rem;border-top:1px solid var(--border)}

.main{flex:1;padding:1.25rem;overflow-y:auto;background:#f0f2f0}

/* ── CARDS ──────────────────────────────────────── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.cardTitle{font-size:14px;font-weight:600;color: var(--blue);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;text-transform:uppercase;letter-spacing:.5px}
.cardTitle small{font-size:12px;font-weight:400;color:#888;text-transform:none;letter-spacing:0;margin-left:.25rem}

/* Stats */
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1rem}
.statBox{background:white;border-radius:10px;padding:1rem;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.statNum{font-size:28px;font-weight:600;color:var(--green);font-family:'DM Serif Display',serif}
.statLbl{font-size:12px;color:#888;margin-top:3px}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;font-family:'DM Sans',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:var(--green);color:white}
.btn-primary:hover{background:var(--green-dark)}
.btn-outline{background:white;border:1.5px solid var(--border);color:#444}
.btn-outline:hover{background:#f5f5f3;border-color:#bbb}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn-danger{background:var(--red);color:white}
.btn-danger:hover{background:#a93226}
.btn-blue{background:var(--blue);color:white}
.btn-blue:hover{background:#0d4a85}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f8f8f6;padding:.55rem .75rem;text-align:left;font-size:11px;font-weight:600;color:#888;border-bottom:1.5px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
td{padding:.65rem .75rem;border-bottom:1px solid rgba(0,0,0,.055);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}

/* Badges */
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;display:inline-block}
.badge-green{background:#dcf5e9;color:#166534}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f1f1ee;color:#555}

/* Form */
.fRow{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.fRow.full{grid-template-columns:1fr}
.fRow.three{grid-template-columns:1fr 1fr 1fr}
.fGroup{display:flex;flex-direction:column;gap:5px}
.fGroup label{font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.4px}
.fGroup input,.fGroup select,.fGroup textarea{
  padding:9px 11px;border:1.5px solid #e0e0dd;border-radius:8px;
  font-size:14px;outline:none;font-family:'DM Sans',sans-serif;
  background:#fafaf8;color:#1a1a1a;transition:.2s
}
.fGroup input:focus,.fGroup select:focus,.fGroup textarea:focus{border-color:var(--green);background:white;box-shadow:0 0 0 3px rgba(26,107,74,.09)}
.fGroup textarea{resize:vertical;min-height:75px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:white;border-radius:16px;padding:1.75rem;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.modalHead h3{font-size:16px;font-weight:600;color:#1a1a1a}
.btnClose{background:none;border:none;font-size:20px;cursor:pointer;color:#999;line-height:1;padding:2px 6px;border-radius:5px;transition:.15s}
.btnClose:hover{background:#f0f0ee;color:#333}
.modalActions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}

/* Calendar */
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.75rem}
.calHead{font-size:11px;font-weight:600;text-align:center;padding:.4rem .2rem;color:#888;text-transform:uppercase;letter-spacing:.3px}
.calDay{min-height:62px;border:1px solid var(--border);border-radius:8px;padding:5px;font-size:12px;cursor:pointer;transition:.15s;position:relative;background:white}
.calDay:hover{border-color:var(--green);background:#f0faf6}
.calDay.today{background:#e8f5ef;border-color:#2d9068}
.calDay.otherMonth{opacity:.35;background:#f8f8f6;cursor:default}
.calDay .dayNum{font-weight:600;color:#333;font-size:12px}
.calDay.today .dayNum{color:var(--green)}
.calDay .ev{background:var(--green);color:white;font-size:9.5px;border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4}
.calDay .ev.conf{background:var(--blue)}
.calNav{display:flex;align-items:center;gap:.75rem}
.calNav button{background:white;border:1.5px solid var(--border);border-radius:7px;padding:5px 12px;cursor:pointer;font-size:17px;line-height:1;transition:.15s}
.calNav button:hover{border-color:#aaa}
.calNav h4{font-size:15px;font-weight:600;flex:1;text-align:center}

/* Chat */
.chatWrap{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:.75rem}
.chatBox{height:330px;overflow-y:auto;padding:.9rem;background:#fafaf8;display:flex;flex-direction:column;gap:.6rem}
.msg{display:flex;flex-direction:column}
.msg.ai{align-items:flex-start}
.msg.user{align-items:flex-end}
.msgLabel{font-size:10.5px;color:#aaa;margin-bottom:3px;font-weight:500}
.bubble{max-width:84%;padding:.6rem .9rem;border-radius:10px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.ai .bubble{background:#e8f5ef;color:#0f4c2e;border-radius:2px 10px 10px 10px}
.msg.user .bubble{background:var(--green);color:white;border-radius:10px 10px 2px 10px}
.chatInputRow{display:flex;border-top:1.5px solid var(--border)}
.chatInputRow input{flex:1;padding:10px 14px;border:none;outline:none;font-size:14px;font-family:'DM Sans',sans-serif;background:white}
.chatInputRow button{background:var(--green);color:white;border:none;padding:10px 16px;cursor:pointer;font-size:18px;transition:.15s}
.chatInputRow button:hover{background:var(--green-dark)}

/* Tabs */
.tabBar{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:2px solid var(--border)}
.tab{padding:.55rem 1.1rem;border:none;background:none;cursor:pointer;font-size:13.5px;color:#888;border-bottom:2.5px solid transparent;margin-bottom:-2px;font-family:'DM Sans',sans-serif;transition:.15s;font-weight:500}
.tab:hover{color:#444}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* Post cards */
.postCard{background:white;border:1.5px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.postPlatform{display:flex;align-items:center;gap:.4rem;font-size:12px;font-weight:600;margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.4px}
.postText{font-size:13.5px;color:#333;line-height:1.6;background:#f8f8f6;border-radius:7px;padding:.7rem;margin-bottom:.6rem;white-space:pre-wrap}

/* Search */
.searchRow{display:flex;gap:.6rem;margin-bottom:1rem;align-items:center}
.searchRow input{flex:1;padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:white;transition:.2s}
.searchRow input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,107,74,.09)}

.section-title{font-size:21px;font-family:'DM Serif Display',serif;color:#1a1a1a;margin-bottom:1rem}
.hint{font-size:12px;color:#999;margin-top:.4rem;line-height:1.5}

.hidden{display:none!important}
.flex{display:flex}.gap5{gap:.5rem}.gap75{gap:.75rem}.jbet{justify-content:space-between}.acen{align-items:center}.mb1{margin-bottom:1rem}.mb05{margin-bottom:.5rem}.mt1{margin-top:1rem}
.w100{width:100%}

/* Vitales grid */
.vitalesGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem;background:#f8f8f6;border-radius:8px;padding:.75rem;margin-bottom:.75rem}
.vitalItem{font-size:13px}
.vitalItem span{display:block;font-size:10.5px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}

/* Patient avatar */
.pacAvatar{width:46px;height:46px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}

/* Notification dot */
.notifDot{width:7px;height:7px;background:#e74c3c;border-radius:50%;flex-shrink:0}

/* Responsive */
@media(max-width:640px){
  .loginLeft{display:none}
  .loginRight{width:100%;border-radius:16px}
  .sidebar{width:56px;padding:.5rem .3rem}
  .navLabel,.topName{display:none}
  .navBtn{justify-content:center;padding:.65rem}
  .fRow{grid-template-columns:1fr}
  .fRow.three{grid-template-columns:1fr 1fr}
  .statGrid{grid-template-columns:1fr 1fr}
  .modal{padding:1.25rem}
}
.cardTitle{
  color:#0b5ed7 !important;
}

/* Pulido final: interfaz mas sobria, publicable y responsive */
:root{
  --green:#176345;
  --green-light:#eaf6f0;
  --green-mid:#26845f;
  --green-dark:#0d4330;
  --blue:#145c93;
  --blue-light:#edf6fb;
  --ink:#18231f;
  --muted:#6c7974;
  --surface:#ffffff;
  --border:rgba(24,35,31,.12);
  --radius:8px;
  --shadow:0 12px 34px rgba(16,31,47,.08);
}

body{
  background:#eef4f1;
  color:var(--ink);
  letter-spacing:0;
}

#loginScreen{
  min-height:100dvh;
  padding:24px;
  background:
    linear-gradient(115deg, rgba(10,39,57,.88), rgba(20,92,147,.68) 48%, rgba(13,67,48,.72)),
    url('ALLAN2 (1).jpeg') center/cover no-repeat !important;
}

#loginScreen::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, rgba(6,28,42,.52), rgba(6,28,42,.08));
  pointer-events:none;
}

.loginWrap{
  position:relative;
  z-index:1;
  width:min(94vw,410px) !important;
  max-width:410px !important;
  border-radius:18px !important;
  box-shadow:0 28px 80px rgba(0,0,0,.32) !important;
}

.loginRight{
  width:100% !important;
  background:rgba(255,255,255,.94) !important;
  color:var(--ink) !important;
  border:1px solid rgba(255,255,255,.62) !important;
  border-radius:18px !important;
  padding:34px 30px !important;
  backdrop-filter:blur(16px);
}

.loginRight .logo img{
  width:78px !important;
  height:auto;
  border-radius:14px;
  box-shadow:0 10px 28px rgba(10,39,57,.14);
}

.loginRight .logo h2{
  color:var(--green-dark) !important;
  font-size:22px;
}

.loginRight .logo p{
  color:var(--muted) !important;
}

.loginRight label{
  color:#33443d !important;
  font-weight:600;
}

.loginRight input,
.searchRow input,
.fGroup input,
.fGroup select,
.fGroup textarea{
  border-radius:8px;
  border:1px solid rgba(24,35,31,.16);
  background:#fbfdfc;
}

.btnLogin,
.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--blue)) !important;
  box-shadow:0 10px 24px rgba(20,92,147,.18);
}

.btnLogin:hover,
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 28px rgba(20,92,147,.22);
}

.topbar{
  background:linear-gradient(90deg,var(--green-dark),var(--blue)) !important;
  min-height:58px;
  padding:.8rem 1.35rem;
}

.sidebar{
  width:232px;
  padding:1rem .75rem;
  background:#fbfdfc;
}

.main{
  background:
    radial-gradient(circle at top left, rgba(38,132,95,.08), transparent 34rem),
    #eef4f1;
  padding:1.35rem;
}

.card,
.statBox,
.postCard,
.modal{
  border-radius:8px;
  box-shadow:var(--shadow);
}

.card{
  overflow-x:auto;
}

.cardTitle{
  color:var(--green-dark) !important;
  letter-spacing:.35px;

  };

  else {

    tropigas.registros = Array.isArray(tropigas.registros) ? tropigas.registros : legacy.registros;
    tropigas.scans = Array.isArray(tropigas.scans) ? tropigas.scans : legacy.scans;

  if (!state.ocupacional.empresas.some(e => e.nombre === state.ocupacional.activeEmpresa)) state.ocupacional.activeEmpresa = 'TROPIGAS';
  const active = state.ocupacional.empresas.find(e => e.nombre === state.ocupacional.activeEmpresa) || state.ocupacional.empresas[0];
  state.ocupacional.empresa = active.nombre;
  state.ocupacional.plantas = active.plantas;

  state.planesSSO = Array.isArray(state.planesSSO) ? state.planesSSO : [];
  state.nextPlanSSOId = state.nextPlanSSOId || 1;
}

function normalizeStateCounters() {
  ensureOcupacionalState();
  state.pacientes.forEach((p, idx) => { if (!p.codigo) p.codigo = String(idx + 1).padStart(6, '0'); });
  const patientCodes = state.pacientes.map(p => Number(p.codigo)).filter(n => Number.isFinite(n) && n > 0);
  if (patientCodes.length && !patientCodes.includes(1) && patientCodes.every(n => n >= 4)) {
    state.pacientes.forEach((p, idx) => { p.codigo = String(idx + 1).padStart(6, '0'); });
  }
  state.nextPacId = Math.max(1, ...state.pacientes.map(p => Number(p.id) || 0)) + 1;
  state.nextPacCode = Math.max(0, ...state.pacientes.map(p => Number(p.codigo) || 0)) + 1;
  state.nextHistId = Math.max(1, ...state.historias.map(h => Number(h.id) || 0)) + 1;
  state.nextCitaId = Math.max(1, ...state.citas.map(c => Number(c.id) || 0)) + 1;
  state.nextPostId = Math.max(1, ...state.posts.map(p => Number(p.id) || 0)) + 1;
  state.nextPlanSSOId = Math.max(1, ...state.planesSSO.map(p => Number(p.id) || 0)) + 1;
  state.ocupacional.empresas.forEach(emp => {
    emp.registros = Array.isArray(emp.registros) ? emp.registros : [];
    emp.scans = Array.isArray(emp.scans) ? emp.scans : [];
    emp.fileIndex = Array.isArray(emp.fileIndex) ? emp.fileIndex : [];
    emp.nextRegistroId = Math.max(1, ...emp.registros.map(r => Number(r.id) || 0)) + 1;
    emp.nextScanId = Math.max(1, ...emp.scans.map(s => Number(s.id) || 0)) + 1;
  });
  const active = state.ocupacional.empresas.find(e => e.nombre === state.ocupacional.activeEmpresa) || state.ocupacional.empresas[0];
  state.ocupacional.nextRegistroId = active.nextRegistroId;
  state.ocupacional.nextScanId = active.nextScanId;
}

function startPatientCollectionSync() {
  if (patientCollectionUnsubscribe) return;
  patientCollectionUnsubscribe = db.collection('pacientes').onSnapshot((snapshot) => {
    const remote = [];
    snapshot.forEach(doc => {
      const data = doc.data() || {};
      if (doc.id === CLOUD_SYNC_DOC || data.state || data.app === 'ClinicaDrAllanLeal') return;
      remote.push({ id:doc.id, ...data });
    });
    const realRemote = remote.some(p => !isDemoPatient(p)) ? remote.filter(p => !isDemoPatient(p)) : remote;
    if (realRemote.length) {
      isApplyingPatientCloudState = true;
      state.pacientes = realRemote.sort((a,b) => Number(a.codigo || 0) - Number(b.codigo || 0));
      const codesBeforeNormalize = state.pacientes.map(p => p.codigo || '').join('|');
      normalizeStateCounters();
      const codesAfterNormalize = state.pacientes.map(p => p.codigo || '').join('|');
      localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(backupPayload()));
      isApplyingPatientCloudState = false;
      if (codesBeforeNormalize !== codesAfterNormalize) syncLocalPatientsToCloud();
      if (currentUser) refreshCurrentViewAfterCloudSync();
    } else if (!isDefaultDemoState(state) && state.pacientes.length) {
      syncLocalPatientsToCloud();
    }
  }, (error) => {
    console.warn('Sincronización general no disponible. Se usará sincronización individual donde aplique.', error);
  });
}

function queueCloudSave() {
  if (isApplyingCloudState || !cloudSyncReady || !currentUser) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(saveStateToCloud, 450);
}

async function saveStateToCloud(force = false) {
  if (isApplyingCloudState || !cloudSyncReady || !currentUser) return;
  try {
    normalizeStateCounters();
    const stateJson = JSON.stringify(state);
    if (!force && stateJson === lastCloudStateJson) return;
    lastCloudStateJson = stateJson;
    await cloudDocRef().set({
      app:'ClinicaDrAllanLeal',
      version:2,
      state,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: currentUser.name || currentUser.username || 'Usuario'
    }, { merge:true });
    cloudSyncErrorNotified = false;
  } catch (e) {
    console.warn('Sincronización general no disponible. Se usará sincronización individual donde aplique.', e);
  }
}

function applyCloudState(remoteState) {
  if (isDefaultDemoState(remoteState) && !isDefaultDemoState(state)) {
    saveStateToCloud(true);
    return;
  }
  isApplyingCloudState = true;
  state = { ...state, ...remoteState };
  normalizeStateCounters();
  lastCloudStateJson = JSON.stringify(state);
  localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(backupPayload()));
  isApplyingCloudState = false;
  if (currentUser) refreshCurrentViewAfterCloudSync();
}

  if (cloudUnsubscribe) return;

function openHandleDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB no disponible'));
    const request = indexedDB.open(ONEDRIVE_HANDLE_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(ONEDRIVE_HANDLE_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveDirectoryHandle(handle) {
  const db = await openHandleDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ONEDRIVE_HANDLE_STORE, 'readwrite');
    tx.objectStore(ONEDRIVE_HANDLE_STORE).put(handle, ONEDRIVE_HANDLE_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function loadDirectoryHandle() {
  const db = await openHandleDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(ONEDRIVE_HANDLE_STORE, 'readonly');
    const request = tx.objectStore(ONEDRIVE_HANDLE_STORE).get(ONEDRIVE_HANDLE_KEY);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
}

async function hasWritePermission(handle, requestPermission = false) {
  const options = { mode:'readwrite' };
  if (!handle.queryPermission || !handle.requestPermission) return true;
  if (await handle.queryPermission(options) === 'granted') return true;
  return requestPermission && await handle.requestPermission(options) === 'granted';
}

async function restoreOneDriveFolderConnection(requestPermission = false) {

  try {
    const handle = await loadDirectoryHandle();
    if (!handle) return false;
    if (!await hasWritePermission(handle, requestPermission)) return false;
    oneDriveDirHandle = handle;
    return true;
  } catch (e) {

  }
}

function safePathName(value) {
  return String(value || 'SIN_DATO')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 90) || 'SIN_DATO';
}

async function getOrCreateSubdir(parentHandle, name) {

}

async function writeFileToHandle(directoryHandle, file, outputName) {
  const fileHandle = await directoryHandle.getFileHandle(safePathName(outputName || file.name), { create:true });
  const writable = await fileHandle.createWritable();
  await writable.write(file);
  await writable.close();
}

async function writeTextToHandle(directoryHandle, fileName, text, type = 'text/html;charset=utf-8') {

  await writable.close();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function patientCode(p) {
  if (!p.codigo) p.codigo = String(Number(p.id) || state.pacientes.indexOf(p) + 1).padStart(6, '0');
  return p.codigo;
}

function clinicImcValue(peso, altura) {
  const p = parseFloat(String(peso || '').replace(',', '.'));
  let a = parseFloat(String(altura || '').replace(',', '.'));
  if (!p || !a) return '';
  if (a > 3) a = a / 100;
  return (p / (a * a)).toFixed(1);
}

function imcClass(value) {
  const n = parseFloat(value);
  if (!n) return '';
  if (n < 18.5) return 'Bajo peso';
  if (n < 25) return 'Peso normal';
  if (n < 30) return 'Sobrepeso';
  if (n < 35) return 'Obesidad grado I';
  if (n < 40) return 'Obesidad grado II';
  return 'Obesidad grado III';
}

function updateClinicImc() {
  const imc = clinicImcValue(document.getElementById('hPesoKg')?.value, document.getElementById('hAltura')?.value);
  const out = document.getElementById('hIMC');
  if (out) out.value = imc ? `${imc} - ${imcClass(imc)}` : '';
}

function importBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.state) throw new Error('Formato inválido');
      state = { ...state, ...data.state };
      normalizeStateCounters();
      saveAppData();
      alert('Respaldo importado correctamente.');
      goTo(currentPage || 'dashboard');
    } catch (e) {
      alert('No se pudo importar el respaldo. Verifique que sea un archivo JSON válido de esta aplicación.');
    } finally {
      input.value = '';
    }
  };
  reader.readAsText(file);
}

    if (querySnapshot.empty) return;
    state.pacientes = []; // limpiamos solo si Firebase trae datos

    querySnapshot.forEach((doc) => {
      state.pacientes.push({
        id: doc.id,
        ...doc.data()
      });
    });

    console.log("Pacientes cargados:", state.pacientes);
    normalizeStateCounters();
    saveAppData();

    if (currentPage === 'pacientes') renderPacientes(); // usa tu función actual
  }).catch((error) => {
    console.warn("No se pudieron cargar pacientes desde Firebase. Se usarán los datos locales.", error);
  });
}

function cargarPacientes() {
  startRealtimeSync();
  startPatientCollectionSync();
  syncLocalPatientsToCloud();
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');

  const btn = document.querySelector('.btnLogin');
  const screen = document.getElementById('loginScreen');
  const app = document.getElementById('app');

  // 🔵 loading
  btn.innerHTML = '<span class="spinner"></span>Ingresando...';
  btn.disabled = true;

  if (USERS[u] && USERS[u].pass === p) {

    currentUser = { username:u, ...USERS[u] };
localStorage.setItem('lastUser', u);
localStorage.setItem('user', JSON.stringify(currentUser));

    // animación salida
    screen.classList.add("fadeOut");

    setTimeout(() => {
      screen.style.display = 'none';

      app.style.display = 'flex';
      app.classList.add("fadeIn");

      initializeUserSession();

    }, 500);

  } else {

    err.style.display = 'block';

    // reset botón si falla
    btn.innerText = "Ingresar al sistema";
    btn.disabled = false;

    setTimeout(() => err.style.display = 'none', 3500);
  }
}

}

function getPac(id)     { return state.pacientes.find(p => String(p.id) === String(id)) || { nombre:'Desconocido' }; }
function fmtF(f)        { if(!f) return '—'; const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`; }
function calcEdad(nac)  { if(!nac) return '—'; const h=new Date(), n=new Date(nac); let e=h.getFullYear()-n.getFullYear(); if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate())) e--; return e+' años'; }

function guardarPaciente() {
  const n = document.getElementById('pNombre').value.trim();

  if (!n) {
    alert('Por favor ingrese el nombre del paciente.');
    return;
  }

  const paciente = {
    codigo: String(state.nextPacCode || state.pacientes.length + 1).padStart(6, '0'),
    nombre: n,
    doc: document.getElementById('pDoc').value,
    nac: document.getElementById('pNac').value,
    sexo: document.getElementById('pSexo').value,
    tel: document.getElementById('pTel').value,
    email: document.getElementById('pEmail').value,
    alergias: document.getElementById('pAlergias').value || 'Ninguna',
    antecedentes: document.getElementById('pAntecedentes').value,
    familiares: document.getElementById('pFamiliares').value
  };

  // 🔥 GUARDAR EN FIREBASE
  db.collection("pacientes").add(paciente)
    .then(() => {
      console.log("Paciente guardado en la nube");

      // (opcional) también guardarlo localmente para ver rápido
      state.pacientes.push({ id: Date.now(), ...paciente });
      normalizeStateCounters();
      saveAppData({ backupToFolder:true });

      closeModal('modalPaciente');

      ['pNombre','pDoc','pNac','pTel','pEmail','pAlergias','pAntecedentes','pFamiliares']
        .forEach(i => document.getElementById(i).value = '');

      refreshClinicPage('pacientes');
    })
    .catch((error) => {
      console.error("Error guardando:", error);
      state.pacientes.push({ id: Date.now(), ...paciente });
      normalizeStateCounters();
      saveAppData({ backupToFolder:true });
      closeModal('modalPaciente');
      refreshClinicPage('pacientes');
      alert("No se pudo guardar en la nube, pero el paciente quedo guardado en el respaldo local.");
    });

function guardarPaciente() {
  const current = editingPacienteId ? getPac(editingPacienteId) : null;
  normalizeStateCounters();
  const codigo = current && current.codigo ? current.codigo : String(state.nextPacCode || state.pacientes.length + 1).padStart(6, '0');
  const paciente = pacienteDesdeFormulario(codigo);
  if (!paciente) return;

  if (editingPacienteId) {

      state.pacientes[idx] = { ...state.pacientes[idx], ...paciente };

      saveAppData({ backupToFolder:true });
      closeModal('modalPaciente');
      refreshClinicPage('pacientes');

    }
    return;
  }

  state.pacientes.push({ id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`, ...paciente });
  normalizeStateCounters();
  savePatientToCloud(state.pacientes[state.pacientes.length - 1]);

  state.pacientes = state.pacientes.filter(x => String(x.id) !== String(id));

function renderAgenda() {
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dias  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const hoy   = new Date();
  const primerDia = new Date(calYear, calMonth, 1).getDay();
  const ultDia    = new Date(calYear, calMonth+1, 0).getDate();
  const prevUlt   = new Date(calYear, calMonth, 0).getDate();
  let cells = '', d = 1, extra = 1;
  for (let i = 0; i < 42; i++) {
    let dayNum, isOther = false;
    if (i < primerDia)      { dayNum = prevUlt - (primerDia - 1 - i); isOther = true; }
    else if (d > ultDia)    { dayNum = extra++; isOther = true; d++; }
    else                    { dayNum = d++; }
    const isHoy = !isOther && dayNum===hoy.getDate() && calMonth===hoy.getMonth() && calYear===hoy.getFullYear();
    const fStr  = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(isOther?0:dayNum).padStart(2,'0')}`;
    const evs   = isOther ? [] : state.citas.filter(c => c.fecha === `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`);
    cells += `<div class="calDay${isOther?' otherMonth':''}${isHoy?' today':''}" ${!isOther?`onclick="diaClick(${calYear},${calMonth+1},${dayNum})"`:''}>
      <div class="dayNum">${dayNum}</div>
      ${evs.slice(0,2).map(c => `<div class="ev${c.estado==='confirmada'?' conf':c.estado==='cancelada'?' cancelada':' reminder'}">${c.hora} ${getPac(c.pacienteId).nombre.split(' ')[0]}</div>`).join('')}
      ${evs.length>2 ? `<div style="font-size:9px;color:#888">+${evs.length-2}</div>` : ''}
    </div>`;
  }
  setC(`

  <div class="calNav">
    <button onclick="cambiarMes(-1)">‹</button>

</div>
<div class="card" style="padding:.75rem">
  <div class="calGrid">${dias.map(d=>`<div class="calHead">${d}</div>`).join('')}${cells}</div>
</div>
<div class="card" style="padding:.5rem">
  <div class="cardTitle" style="padding:.5rem .25rem 0">📋 Lista de citas</div>
  <table><thead><tr><th>Fecha</th><th>Hora</th><th>Paciente</th><th>Tipo</th><th>Recordatorio</th><th>Estado</th><th>Acción</th></tr></thead>
  <tbody>${state.citas.slice().sort((a,b)=>a.fecha>b.fecha?1:-1).map(c => `<tr>
    <td>${fmtF(c.fecha)}</td><td><strong>${c.hora}</strong></td>
    <td>${getPac(c.pacienteId).nombre}</td>
    <td>${c.tipo}</td>

    <td><span class="badge ${citaBadgeClass(c.estado)}">${c.estado}</span></td>
    <td><div style="display:flex;gap:.35rem;flex-wrap:wrap">
      ${c.estado!=='confirmada'?`<button class="btn btn-sm btn-outline" onclick="confirmarCita('${c.id}')">Confirmar</button>`:'<span style="color:#aaa;font-size:12px">✓ Confirmada</span>'}

  return state.ocupacional.empresas.find(e => e.nombre === state.ocupacional.activeEmpresa) || state.ocupacional.empresas[0];
}
function setOccEmpresa(nombre) {
  state.ocupacional.activeEmpresa = nombre;
  ensureOcupacionalState();
  document.body.classList.toggle('occ-tropigas', nombre === 'TROPIGAS');
  renderSidebar();
  goTo('occDashboard');
}
function crearEmpresaOcupacional() {
  const nombre = (document.getElementById('newEmpresaNombre')?.value || '').trim().toUpperCase();
  const plantas = (document.getElementById('newEmpresaPlantas')?.value || '').split(',').map(p => p.trim().toUpperCase()).filter(Boolean);
  if (!nombre || !plantas.length) { alert('Ingrese nombre de empresa y al menos una planta o sede.'); return; }
  if (state.ocupacional.empresas.some(e => e.nombre === nombre)) { alert('Ya existe una empresa con ese nombre.'); return; }
  state.ocupacional.empresas.push({ nombre, plantas, registros:[], scans:[], fileIndex:[], nextRegistroId:1, nextScanId:1, oneDriveUrl:'' });
  state.ocupacional.activeEmpresa = nombre;
  saveAppData({ backupToFolder:true });
  setOccEmpresa(nombre);
}
function occPlantsOptions(selected) {
  return occData().plantas.map(p => `<option value="${p}" ${p===selected?'selected':''}>${p}</option>`).join('');
}
function occAptClass(aptitud) {
  if (aptitud === 'Apto') return 'aptApto';
  if (aptitud === 'Apto con restricción') return 'aptRestriccion';
  if (aptitud === 'No apto con restricción') return 'aptNoAptoRestriccion';
  return 'aptNoApto';
}
function occImc(peso, altura) {
  const p = parseFloat(String(peso || '').replace(',', '.'));
  let a = parseFloat(String(altura || '').replace(',', '.'));
  if (!p || !a) return '';
  if (a > 3) a = a / 100;
  return (p / (a * a)).toFixed(1);
}
function updateOccImc() {
  const out = document.getElementById('occImc');
  if (out) out.value = occImc(document.getElementById('occPeso')?.value, document.getElementById('occAltura')?.value);
}
function ruffierIndex(p0, p1, p2) {
  const vals = [p0,p1,p2].map(v => parseFloat(String(v || '').replace(',', '.')));
  if (vals.some(v => !v)) return '';
  return ((vals[0] + vals[1] + vals[2] - 200) / 10).toFixed(1);
}
function ruffierClass(value) {
  const n = parseFloat(value);
  if (Number.isNaN(n)) return '';
  if (n <= 0) return 'Excelente (deportista élite)';
  if (n <= 5) return 'Muy buena';
  if (n <= 10) return 'Buena';
  if (n <= 15) return 'Insuficiente';
  return 'Malo';
}
function updateRuffier() {
  const idx = ruffierIndex(document.getElementById('occRuffierReposo')?.value, document.getElementById('occRuffierEsfuerzo')?.value, document.getElementById('occRuffierRecuperacion')?.value);
  const out = document.getElementById('occRuffierResultado');
  if (out) out.value = idx ? `${idx} - ${ruffierClass(idx)}` : '';
}
function countBy(records, keyFn) {
  return records.reduce((acc, row) => {
    const key = keyFn(row) || 'Sin dato';
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}
function tableFromCounts(counts, label) {
  const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  return `<table><thead><tr><th>${label}</th><th>Total</th></tr></thead><tbody>${rows || '<tr><td colspan="2" style="text-align:center;color:#aaa;padding:1rem">Sin datos.</td></tr>'}</tbody></table>`;
}
function isHighBp(pa) {
  const m = String(pa || '').match(/(\d{2,3})\D+(\d{2,3})/);
  return m ? Number(m[1]) >= 140 || Number(m[2]) >= 90 : false;
}
function isHighGlucose(gmt) {
  const n = parseFloat(String(gmt || '').replace(',', '.'));
  return n >= 126;
}
function ageGroup(edad) {
  const n = Number(edad);
  if (!n) return 'Sin edad';
  if (n < 30) return '18-29';
  if (n < 40) return '30-39';
  if (n < 50) return '40-49';
  if (n < 60) return '50-59';
  return '60+';
}
function isPilot(row) {
  return /piloto|conductor|driver|chofer/i.test(`${row.puesto || ''} ${row.area || ''}`);
}
function occHeader(title, subtitle) {
  const company = activeOccCompany();
  return `<div class="occHeader">
    <div><div class="occTitle">${title}</div><div class="occSubtitle">${subtitle}</div></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="${company.nombre === 'TROPIGAS' ? 'openTropigasOneDriveFolder()' : 'openOneDriveWebFolder()'}">Abrir OneDrive</button>
      ${isOcupViewer() ? '' : `<button class="btn btn-primary" onclick="goTo('occRegistros')">+ Registro EMOP</button>`}
    </div>
  </div>`;
}
function occFilteredRecords(planta, fecha) {
  return occData().registros.filter(r => (!planta || planta === 'TODAS' || r.planta === planta) && (!fecha || r.fechaEvaluacion === fecha));
}
function occAptCounts(records) {
  const base = { 'Apto':0, 'Apto con restricción':0, 'No apto con restricción':0, 'No apto':0 };
  records.forEach(r => { base[r.aptitudLaboral] = (base[r.aptitudLaboral] || 0) + 1; });
  return base;
}

function guardarOcupacionalRegistro() {
  const planta = document.getElementById('occPlanta').value;
  const fecha = document.getElementById('occFecha').value;
  const nombre = document.getElementById('occNombre').value.trim();
  if (!fecha || !nombre) { alert('Ingrese fecha de evaluación y nombre completo.'); return; }
  const id = occData().nextRegistroId++;
  const expediente = document.getElementById('occExpediente').value.trim() || `TRO-${planta.replace(/\s+/g,'').slice(0,3)}-${new Date(fecha).getFullYear()}-${String(id).padStart(4,'0')}`;
  const registro = {
    id, expediente, planta, fechaEvaluacion:fecha, nombre,
    dpi:document.getElementById('occDpi').value.trim(),
    puesto:document.getElementById('occPuesto').value.trim(),
    area:document.getElementById('occArea').value.trim(),
    edad:document.getElementById('occEdad').value,
    pa:document.getElementById('occPa').value, fc:document.getElementById('occFc').value, fr:document.getElementById('occFr').value,
    temp:document.getElementById('occTemp').value, spo2:document.getElementById('occSpo2').value, gmt:document.getElementById('occGmt').value,
    peso:document.getElementById('occPeso').value, altura:document.getElementById('occAltura').value, imc:document.getElementById('occImc').value,
    motivoConsulta:document.getElementById('occMotivo').value, historiaActual:document.getElementById('occHistoria').value,
    examenFisico:document.getElementById('occExamen').value, diagnosticos:document.getElementById('occDiagnosticos').value,
    aptitudLaboral:document.getElementById('occAptitud').value,
    ruffierReposo:document.getElementById('occRuffierReposo').value,
    ruffierEsfuerzo:document.getElementById('occRuffierEsfuerzo').value,
    ruffierRecuperacion:document.getElementById('occRuffierRecuperacion').value,
    ruffierIndice:ruffierIndex(document.getElementById('occRuffierReposo').value, document.getElementById('occRuffierEsfuerzo').value, document.getElementById('occRuffierRecuperacion').value),
    ruffierClasificacion:ruffierClass(ruffierIndex(document.getElementById('occRuffierReposo').value, document.getElementById('occRuffierEsfuerzo').value, document.getElementById('occRuffierRecuperacion').value)),
    tratamiento:document.getElementById('occTratamiento').value
  };
  occData().registros.push(registro);
  normalizeStateCounters();
  saveAppData({ backupToFolder:true });
  alert('Evaluación ocupacional guardada.');
  renderOcupRegistros();
}

async function walkDirectoryFiles(dirHandle, base = '') {
  const out = [];
  for await (const [name, handle] of dirHandle.entries()) {
    const rel = base ? `${base}/${name}` : name;
    if (handle.kind === 'file') {
      const file = await handle.getFile();
      out.push({ nombreArchivo:name, ruta:rel, tamano:`${Math.round(file.size/1024)} KB`, modifiedAt:file.lastModified ? new Date(file.lastModified).toISOString() : '' });
    } else if (handle.kind === 'directory') {
      out.push(...await walkDirectoryFiles(handle, rel));
    }
  }
  return out;
}

async function indexarCarpetaOcupacional() {
  if (!window.showDirectoryPicker) {
    alert('Este navegador no permite seleccionar carpetas. Use Edge o Chrome actualizado.');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode:'read' });
    const files = await walkDirectoryFiles(handle);
    const allowed = files.filter(f => /\.(docx?|xlsx?|pdf|png|jpe?g)$/i.test(f.nombreArchivo));
    activeOccCompany().fileIndex = allowed.map((f, idx) => ({ id:idx+1, ...f, indexedAt:new Date().toISOString() }));
    saveAppData({ backupToFolder:true });
    alert(`Índice creado: ${allowed.length} archivo(s) de Word, Excel, PDF o imagen.`);
    renderOcupDashboard();
  } catch (e) {
    if (e.name !== 'AbortError') alert('No se pudo indexar la carpeta seleccionada.');
  }
}

async function sendChat() {

  try {
    const res  = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:sys, messages:state.chatHistory.map(m => ({ role:m.role==='ai'?'assistant':'user', content:m.text })) }) });

function genRecordatorio(nombre, fecha, hora, tipo) {
  const msg = `📅 *Recordatorio de Cita Médica*\n\nEstimado/a *${nombre}*,\n\nLe recordamos que tiene una cita programada:\n\n🗓 Fecha: *${fecha}*\n⏰ Hora: *${hora}*\n🩺 Tipo: ${tipo}\n\nPor favor:\n• Llegue 10 minutos antes\n• Traiga su documento de identidad\n• Lleve exámenes o resultados previos si los tiene\n\nPara confirmar o cancelar su cita, escríbanos a este número.\n\n¡Le esperamos! 😊🏥`;
  navigator.clipboard && navigator.clipboard.writeText(msg).catch(() => {});
  const ta = document.createElement('textarea'); ta.value = msg; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  alert('✅ Mensaje copiado al portapapeles.\n\nYa puede pegarlo en WhatsApp.');
}

function openClinicWhatsApp(text = '') {
  const phone = (state.socialLinks?.whatsapp || '+50238006697').replace(/\D/g, '');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
}

// ── REDES SOCIALES ────────────────────────────────
function renderRedes() {
  setC(`
<div class="tabBar">
  <button class="tab active" onclick="switchTabR(this,'tabPosts')">📄 Publicaciones</button>
  <button class="tab" onclick="switchTabR(this,'tabGenerar')">✨ Generar con IA</button>
</div>
<div id="tabPosts">
  <div class="card">
    <div class="cardTitle">Conexiones de la clínica</div>
    <div class="socialLinkGrid">
      <div class="fGroup"><label>Facebook</label><input id="socialFacebook" value="${state.socialLinks?.facebook || ''}" placeholder="Link de la página de Facebook"></div>
      <div class="fGroup"><label>Instagram</label><input id="socialInstagram" value="${state.socialLinks?.instagram || ''}" placeholder="Link de Instagram"></div>
      <div class="fGroup"><label>Página web</label><input id="socialWebsite" value="${state.socialLinks?.website || ''}" placeholder="https://..."></div>
      <div class="fGroup"><label>WhatsApp clínica</label><input id="socialWhatsapp" value="${state.socialLinks?.whatsapp || '+50238006697'}"></div>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem">
      <button class="btn btn-primary" onclick="guardarSocialLinks()">Guardar conexiones</button>
      <button class="btn btn-outline" onclick="abrirSocial('facebook')">Abrir Facebook</button>
      <button class="btn btn-outline" onclick="abrirSocial('instagram')">Abrir Instagram</button>
      <button class="btn btn-outline" onclick="abrirSocial('website')">Abrir página web</button>
    </div>
    <p style="font-size:12px;color:#888;margin-top:.75rem">Para publicación automática real se usa Meta Business/API. No es recomendable guardar usuarios y contraseñas dentro de esta página.</p>
  </div>
  ${state.posts.length === 0 ? '<p style="color:#aaa">No hay publicaciones aún. Use la pestaña "Generar con IA".</p>' : ''}
  ${state.posts.map(p => `<div class="postCard">
    <div class="postPlatform" style="color:${p.plataforma==='facebook'?'#1877f2':'#e1306c'}">
      ${p.plataforma==='facebook'?'📘 Facebook':'📸 Instagram'}
      <span style="color:#aaa;font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;margin-left:auto">${fmtF(p.fecha)}</span>
      <span class="badge ${p.estado==='publicado'?'badge-green':'badge-gray'}">${p.estado}</span>
    </div>
    <div class="postText">${p.texto}</div>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-sm btn-outline" onclick="copiarPost(${p.id})">📋 Copiar</button>
      <button class="btn btn-sm btn-primary" onclick="abrirSocial('${p.plataforma}')">Abrir red</button>
      <button class="btn btn-sm btn-outline" style="color:var(--red)" onclick="eliminarPost(${p.id})">🗑 Eliminar</button>
    </div>
  </div>`).join('')}
</div>
<div id="tabGenerar" class="hidden">
  <div class="card">
    <div class="cardTitle">✨ Generador de contenido con IA</div>
    <div class="fRow">
      <div class="fGroup"><label>Red social</label>
        <select id="redSel"><option value="facebook">Facebook</option><option value="instagram">Instagram</option></select>
      </div>
      <div class="fGroup"><label>Tema del contenido</label>
        <select id="temaSel">
          <option>Prevención de enfermedades</option>
          <option>Tips de salud diarios</option>
          <option>Higiene y bienestar</option>
          <option>Importancia del chequeo médico</option>
          <option>Alimentación saludable</option>
          <option>Ejercicio y salud</option>
          <option>Salud mental y estrés</option>
          <option>Información de servicios del consultorio</option>
          <option>Datos curiosos de salud</option>
          <option>Cuidado cardiovascular</option>
        </select>
      </div>
    </div>
    <div class="fRow full">
      <div class="fGroup"><label>Instrucciones adicionales (opcional)</label>
        <input type="text" id="instrAd" placeholder="Ej: Enfocado en adultos mayores, tono motivacional, mencionar horario de atención..."/>
      </div>
    </div>
    <button class="btn btn-primary" onclick="generarPost()" id="btnGenPost">✨ Generar publicación</button>
    <div id="postPreview" style="display:none;margin-top:1rem;border:1.5px solid var(--border);border-radius:10px;padding:1rem">
      <div style="font-size:10.5px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.5rem">Vista previa</div>
      <div id="postTextoPreview" style="font-size:13.5px;line-height:1.65;white-space:pre-wrap;background:#f8f8f6;border-radius:7px;padding:.75rem"></div>
      <div style="display:flex;gap:.5rem;margin-top:.75rem">
        <button class="btn btn-sm btn-primary" onclick="guardarPost()">💾 Guardar publicación</button>
        <button class="btn btn-sm btn-outline" onclick="generarPost()">🔄 Regenerar</button>
      </div>
    </div>
  </div>
</div>`);
}
function switchTabR(btn, tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  ['tabPosts','tabGenerar'].forEach(id => { const el=document.getElementById(id); if(el) el.classList.toggle('hidden', id!==tabId); });
}
function guardarSocialLinks() {
  state.socialLinks = {
    facebook:document.getElementById('socialFacebook')?.value.trim() || '',
    instagram:document.getElementById('socialInstagram')?.value.trim() || '',
    website:document.getElementById('socialWebsite')?.value.trim() || '',
    whatsapp:document.getElementById('socialWhatsapp')?.value.trim() || '+50238006697'
  };
  saveAppData({ backupToFolder:true });
  alert('Conexiones guardadas.');
}
function abrirSocial(tipo) {
  const url = state.socialLinks?.[tipo];
  if (!url) { alert('Primero guarde el enlace de ' + tipo + ' en Conexiones de la clínica.'); return; }
  window.open(url, '_blank', 'noopener');
}
let postGenerado = { plataforma:'', texto:'' };
async function generarPost() {
  const red   = document.getElementById('redSel').value;
  const tema  = document.getElementById('temaSel').value;
  const instr = document.getElementById('instrAd').value;
  const btn   = document.getElementById('btnGenPost');
  btn.textContent = '⏳ Generando...'; btn.disabled = true;
  const prompt = `Crea un post para ${red==='facebook'?'Facebook':'Instagram'} de un consultorio médico especialista en Guatemala sobre el tema: "${tema}". ${instr?'Instrucciones adicionales: '+instr+'.':''}\n\nEl post debe ser:\n- Educativo, profesional y cálido\n- Apropiado para un consultorio médico\n- Con emojis apropiados (no excesivos)\n- Con 3-5 hashtags relevantes al final\n- Entre 80-150 palabras\n\nResponde SOLO con el texto del post, sin explicaciones ni comillas alrededor.`;
  try {
    const res  = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:500, messages:[{role:'user',content:prompt}] }) });
    const data = await res.json();
    postGenerado = { plataforma:red, texto:data.content?.[0]?.text || 'Error al generar.' };
  } catch(e) {
    postGenerado = { plataforma:red, texto:`🌿 La salud es nuestro bien más preciado.\n\n${tema} es fundamental para mantener una vida plena y saludable. En nuestro consultorio estamos comprometidos con tu bienestar. 💚\n\nAgenda tu cita hoy y demos juntos el primer paso hacia una mejor salud.\n\n#Salud #Bienestar #ConsultorioMedico #Guatemala` };
  }
  document.getElementById('postTextoPreview').textContent = postGenerado.texto;
  document.getElementById('postPreview').style.display = 'block';
  btn.textContent = '✨ Generar publicación'; btn.disabled = false;
}
function guardarPost() {
  state.posts.unshift({ id:state.nextPostId++, plataforma:postGenerado.plataforma, texto:postGenerado.texto, fecha:new Date().toISOString().split('T')[0], estado:'borrador' });
  saveAppData({ backupToFolder:true });
  document.getElementById('postPreview').style.display = 'none';
  switchTabR(document.querySelector('.tabBar .tab'), 'tabPosts');
  renderRedes();
}
function copiarPost(id) {
  const p = state.posts.find(x => x.id===id);
  if (!p) return;
  navigator.clipboard && navigator.clipboard.writeText(p.texto).catch(()=>{});
  const ta = document.createElement('textarea'); ta.value = p.texto; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  alert('✅ Post copiado al portapapeles.');
}
function eliminarPost(id) {
  if (confirm('¿Desea eliminar esta publicación?')) { state.posts = state.posts.filter(x => x.id!==id); saveAppData({ backupToFolder:true }); renderRedes(); }
}
</script>
</body>
</html>
